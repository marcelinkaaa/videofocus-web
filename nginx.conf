# Served by nginx:alpine (see Dockerfile). Replaces the image's default.conf.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative Location headers, so redirects stay correct behind Caddy.
    absolute_redirect off;

    # Clean URLs: /guides/foo serves guides/foo.html. Old .html links keep working.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /llms.txt { default_type text/plain; charset utf-8; }

    location ~* \.(?:css|js|png|jpe?g|webp|svg|ico|mp4|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
}
